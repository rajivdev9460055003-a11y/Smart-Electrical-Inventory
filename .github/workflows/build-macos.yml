name: Build Mac Application

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab

      - name: Build Mac application
        run: |
          pyinstaller --clean --noconfirm "Smart Electrical Inventory.spec"

      - name: Upload Mac application
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Electrical-Inventory-Mac
          path: "dist/Smart Electrical Inventory.app"
